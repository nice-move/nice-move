{
  "language": MarkdownLanguage {
    "columnStart": 1,
    "defaultLanguageOptions": {
      "frontmatter": false,
      "math": false,
    },
    "fileType": "text",
    "lineStart": 1,
    "nodeTypeKey": "type",
  },
  "languageOptions": {
    "frontmatter": "yaml",
    "math": false,
  },
  "linterOptions": {
    "noInlineConfig": false,
    "reportUnusedDisableDirectives": "warn",
  },
  "plugins": [
    "@",
    "promise",
    "import-x",
    "markdown",
  ],
  "processor": {
    "meta": {
      "name": "@eslint/markdown/markdown",
      "version": "8.0.3",
    },
    "postprocess": [Function],
    "preprocess": [Function],
    "supportsAutofix": true,
  },
  "rules": {
    "import-x/default": [
      "error",
    ],
    "import-x/export": [
      "error",
    ],
    "import-x/named": [
      "error",
    ],
    "import-x/namespace": [
      "error",
    ],
    "import-x/no-duplicates": [
      "warn",
    ],
    "import-x/no-named-as-default": [
      "warn",
    ],
    "import-x/no-named-as-default-member": [
      "warn",
    ],
    "import-x/no-unresolved": [
      "error",
    ],
    "markdown/fenced-code-language": [
      "error",
      {
        "required": [],
      },
    ],
    "markdown/heading-increment": [
      "error",
      {
        "frontmatterTitle": "^(?!\s*['"]title[:=]['"])\s*\{?\s*['"]?title['"]?\s*[:=]",
      },
    ],
    "markdown/no-duplicate-definitions": [
      "error",
      {
        "allowDefinitions": [
          "//",
        ],
        "allowFootnoteDefinitions": [],
        "checkFootnoteDefinitions": true,
      },
    ],
    "markdown/no-empty-definitions": [
      "error",
      {
        "allowDefinitions": [
          "//",
        ],
        "allowFootnoteDefinitions": [],
        "checkFootnoteDefinitions": true,
      },
    ],
    "markdown/no-empty-images": [
      "error",
    ],
    "markdown/no-empty-links": [
      "error",
    ],
    "markdown/no-html": [
      "warn",
      {
        "allowed": [],
        "allowedIgnoreCase": false,
      },
    ],
    "markdown/no-invalid-label-refs": [
      "error",
    ],
    "markdown/no-missing-atx-heading-space": [
      "error",
      {
        "checkClosedHeadings": false,
      },
    ],
    "markdown/no-missing-label-refs": [
      "error",
      {
        "allowLabels": [],
      },
    ],
    "markdown/no-missing-link-fragments": [
      "error",
      {
        "allowPattern": "",
        "ignoreCase": true,
      },
    ],
    "markdown/no-multiple-h1": [
      "error",
      {
        "frontmatterTitle": "^(?!\s*['"]title[:=]['"])\s*\{?\s*['"]?title['"]?\s*[:=]",
      },
    ],
    "markdown/no-reference-like-urls": [
      "error",
    ],
    "markdown/no-reversed-media-syntax": [
      "error",
    ],
    "markdown/no-space-in-emphasis": [
      "error",
      {
        "checkStrikethrough": false,
      },
    ],
    "markdown/no-unused-definitions": [
      "error",
      {
        "allowDefinitions": [
          "//",
        ],
        "allowFootnoteDefinitions": [],
        "checkFootnoteDefinitions": true,
      },
    ],
    "markdown/require-alt-text": [
      "error",
    ],
    "markdown/table-column-count": [
      "error",
      {
        "checkMissingCells": false,
      },
    ],
    "promise/catch-or-return": [
      "warn",
      {
        "allowFinally": true,
      },
    ],
    "promise/no-nesting": [
      "warn",
    ],
    "promise/no-new-statics": [
      "error",
    ],
    "promise/no-promise-in-callback": [
      "warn",
    ],
    "promise/no-return-in-finally": [
      "warn",
    ],
    "promise/no-return-wrap": [
      "error",
    ],
    "promise/param-names": [
      "error",
    ],
    "promise/valid-params": [
      "warn",
    ],
  },
}