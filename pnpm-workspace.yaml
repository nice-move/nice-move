packages:
  - packages/*
  - modules/*
  - tools/*

catalog:
  '@eslint/compat': ^2.1.1
  '@eslint/eslintrc': ^3.3.7
  '@eslint/js': ^10.0.1
  '@eslint/markdown': ^8.0.3
  chalk: ^6.0.0
  deepmerge-ts: ^8.0.2
  eslint-plugin-vue: ^10.11.0
  execa: ^10.0.1
  fs-chain: ^10.0.0
  garou: ^0.9.22
  lodash: ^4.18.1
  settingz: ^0.2.0
  sort-keys: ^6.0.1
  stylelint: ^17.15.0
  typescript: ~6.0.3
  typescript-eslint: ^8.70.1
  yaml: ^2.9.1

catalogs:
  overrides:
    eslint: ^10.9.1
    eslint-plugin-react-hooks: ^7.1.1
    globals: ^17.11.0
    prettier: ~3.9.8
  vitest:
    '@vitest/ui': ^5.0.1
    vitest: ^5.0.1

configDependencies:
  pnpm-plugin-nice-move: 0.3.7+sha512-XmvMlOA/Zd26tv69MyOSC90isG1+APVs8k6D0hGxV/FFYipyKtToR4eYo+ueptlEGce3nDegg7kWnjDF6aXHUQ==

overrides:
  eslint: catalog:overrides
  eslint-plugin-react-hooks: catalog:overrides
  globals: catalog:overrides

patchedDependencies:
  '@commitlint/rules': .patches/@commitlint__rules.patch
  lint-staged: .patches/lint-staged.patch

trustPolicyExclude:
  - '@pnpm/config'
  - '@pnpm/types'
