packages:
  - packages/*
  - modules/*
  - tools/*

catalog:
  '@eslint/compat': ^2.1.1
  '@eslint/eslintrc': ^3.3.7
  '@eslint/js': ^10.0.1
  '@eslint/markdown': ^8.0.3
  chalk: ^6.0.1
  deepmerge-ts: ^8.0.2
  eslint-plugin-vue: ^10.12.1
  execa: ^10.2.1
  fs-chain: ^10.0.0
  garou: ^0.9.22
  lodash: ^4.18.1
  settingz: ^0.2.0
  sort-keys: ^6.0.1
  stylelint: ^18.0.0
  typescript: ~6.0.3
  typescript-eslint: ^8.72.2
  yaml: ^2.9.1

catalogs:
  overrides:
    '@stylistic/stylelint-plugin': ^6.0.1
    eslint: ^10.14.0
    eslint-plugin-react-hooks: ^7.1.1
    globals: ^17.11.0
    prettier: ~3.9.10
  vitest:
    '@vitest/ui': ^5.1.0
    vitest: ^5.1.0

overrides:
  '@stylistic/stylelint-plugin': catalog:overrides
  eslint: catalog:overrides
  eslint-plugin-react-hooks: catalog:overrides
  globals: catalog:overrides

minimumReleaseAgeExclude:
  - postcss-selector-parser@7.2.1
  - stylelint-declaration-block-no-ignored-properties@3.1.0
  - stylelint-scss@7.5.0
  - postcss-less@7.1.0

patchedDependencies:
  '@commitlint/rules': .patches/@commitlint__rules.patch

trustPolicyExclude:
  - '@pnpm/config'
  - '@pnpm/types'
